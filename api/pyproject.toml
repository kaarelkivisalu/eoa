[project]
name = "eoa-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.1",
    "fastapi[standard]>=0.128.0",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.45",
]

[dependency-groups]
dev = ["ruff", "sqlacodegen>=3.2.0", "ty"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", "D101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["INP001", "ERA001"]
"migrations/versions/*" = ["ALL"]
